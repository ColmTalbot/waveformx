#
# The quick tier of the tests (``pytest``: tests/test_quick.py and
# tests/test_api.py) against LALSimulation 6.2.0 (conda-forge's build, as in
# development: PyPI's lalsuite differs in the time-domain conversion) and
# waveformrs (from git: 0.2 on PyPI changed IMRPhenomXPNR), with
# the NRSur7dq4 data file, and a check of the sdist and wheel. The MLX tests
# are not in the quick tier (GitHub's macOS runners have no Metal GPU).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NRSUR7DQ4_FILE: NRSur7dq4_v1.0.h5
  NRSUR7DQ4_URL: https://zenodo.org/records/14999310/files/NRSur7dq4_v1.0.h5
  NRSUR7DQ4_MD5: ec4a0a9c6af39ad14dc91d42957144e9
  # the last commit of waveformrs 0.1, with IMRPhenomXPNR's pnr_parity_fix
  WAVEFORMRS: git+https://github.com/ColmTalbot/waveformrs@fcba92e4a6b6ffb57ce6c65494e3183192cf6e4b#subdirectory=python

jobs:
  quick:
    name: quick tier (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    env:
      NRSUR7DQ4_DATA: ${{ github.workspace }}/../lal_data/NRSur7dq4_v1.0.h5
      WAVEFORMX_TEST_CACHE: ${{ github.workspace }}/../jax_cache
    defaults:
      run:
        shell: bash -el {0}  # in the micromamba environment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: waveformx
          create-args: >-
            python=${{ matrix.python }}
            python-lalsimulation=6.2.0=*_4
            pip
          channels: conda-forge
          cache-environment: true

      # pip keeps the wheel of waveformrs, which it builds with the runner's Rust
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py${{ matrix.python }}-

      - name: Install waveformx with the test dependencies
        run: python -m pip install ".[test]" "waveformrs @ $WAVEFORMRS"

      - name: Versions
        run: |
          python -c "import lal, lalsimulation; print('lal', lal.__version__, 'lalsimulation', lalsimulation.__version__)"
          python -m pip list | grep -i -E "^(jax|jaxlib|numpy|h5py|waveformrs|waveformx|pytest) "

      - name: Cache the NRSur7dq4 data file
        id: nrsur
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../lal_data
          key: nrsur7dq4-${{ env.NRSUR7DQ4_MD5 }}

      - name: Download the NRSur7dq4 data file
        if: steps.nrsur.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$NRSUR7DQ4_DATA")"
          curl -sSfL --retry 5 -o "$NRSUR7DQ4_DATA" "$NRSUR7DQ4_URL"
          python -c "import hashlib, sys; d = hashlib.md5(open(sys.argv[1], 'rb').read()).hexdigest(); sys.exit(d != '$NRSUR7DQ4_MD5' and f'md5 {d}')" "$NRSUR7DQ4_DATA"

      # JAX's compiled code depends on the CPU, so the key names it
      - name: Identify the CPU
        id: cpu
        run: |
          if [ "$RUNNER_OS" = macOS ]; then cpu=$(sysctl -n machdep.cpu.brand_string); else cpu=$(grep -m1 "model name" /proc/cpuinfo); fi
          echo "$cpu"
          echo "hash=$(echo "$cpu" | python -c "import hashlib, sys; print(hashlib.sha256(sys.stdin.read().encode()).hexdigest()[:12])")" >> "$GITHUB_OUTPUT"

      - name: Cache JAX's compiled code
        uses: actions/cache@v4
        with:
          path: ${{ env.WAVEFORMX_TEST_CACHE }}
          key: jax-${{ runner.os }}-py${{ matrix.python }}-${{ steps.cpu.outputs.hash }}-${{ hashFiles('src/**/*.py', 'tests/test_quick.py', 'tests/test_api.py') }}
          restore-keys: jax-${{ runner.os }}-py${{ matrix.python }}-${{ steps.cpu.outputs.hash }}-

      - name: Quick tier
        run: python -m pytest -rs --durations=5

  package:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      - name: Check
        run: |
          python -m twine check --strict dist/*
          python .github/scripts/check_dist.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
